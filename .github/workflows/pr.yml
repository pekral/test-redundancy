name: Checks

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  quality-checks:
    name: "Quality checks (PHP 8.5)"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: pcov

      - name: Configure git for the git-based tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Composer normalize
        run: composer composer-normalize-check

      - name: PHP CodeSniffer (pekral/phpcs-rules)
        run: composer phpcs-check

      - name: Laravel Pint
        run: composer pint-check

      - name: Rector (pekral/rector-rules)
        run: composer rector-check

      - name: PHPStan max level (pekral/phpstan-rules)
        run: composer analyse

      - name: Security audit
        run: composer security-audit

      - name: Tests with 100% coverage
        run: composer test:coverage

      - name: Run the tool on its own tests
        run: php bin/test-redundancy tests > /dev/null

  compatibility:
    name: "Tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies)"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']
        dependencies: ['lowest', 'highest']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov

      - name: Configure git for the git-based tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      # The quality tooling needs PHP 8.4+. Drop it, so the matrix resolves exactly what a consumer installs.
      - name: Remove the quality tooling
        run: >
          composer remove --dev --no-update --no-interaction
          ergebnis/composer-normalize laravel/pint pekral/ai-olympus pekral/phpcs-rules pekral/phpstan-rules pekral/rector-rules
          phpstan/phpstan-deprecation-rules phpstan/phpstan-phpunit

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}

      - name: Lint the shipped sources
        run: find src bin -type f -exec php -l {} \; > /dev/null

      - name: Run tests
        run: vendor/bin/pest
