name: Checks

on:
  pull_request:
    branches: [ master ]
  push:
    branches: [ master ]

jobs:
  quality-checks:
    name: "Quality checks (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov

      - name: Configure git for the git-based tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction

      - name: Show the resolved quality tooling
        run: composer show --direct | grep -E '^(pekral/(phpcs|phpstan|rector)-rules|laravel/pint|pestphp/pest) '

      - name: Composer normalize
        run: composer composer-normalize-check

      - name: PHP CodeSniffer (pekral/phpcs-rules)
        run: composer phpcs-check

      - name: Laravel Pint
        run: composer pint-check

      - name: Rector (pekral/rector-rules)
        run: composer rector-check

      - name: PHPStan max level (pekral/phpstan-rules)
        run: composer analyse

      - name: Security audit
        run: composer security-audit

      - name: Tests with 100% coverage
        run: composer test:coverage

      - name: Run the tool on its own tests
        run: |
          php bin/test-redundancy tests/Unit tests/Feature > /dev/null
          php bin/test-redundancy verify

  compatibility:
    name: "Tests (PHP ${{ matrix.php }}, ${{ matrix.dependencies }} dependencies)"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
        dependencies: ['lowest', 'highest']

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov

      - name: Configure git for the git-based tests
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"

      # Drop the quality tooling, so the matrix resolves exactly what a consumer installs.
      - name: Remove the quality tooling
        run: >
          composer remove --dev --no-update --no-interaction
          ergebnis/composer-normalize laravel/pint pekral/ai-olympus pekral/phpcs-rules pekral/phpstan-rules pekral/rector-rules
          phpstan/phpstan-deprecation-rules phpstan/phpstan-phpunit

      - name: Install dependencies
        run: composer update --prefer-dist --no-progress --no-interaction ${{ matrix.dependencies == 'lowest' && '--prefer-lowest' || '' }}

      - name: Lint the shipped sources
        run: find src bin -type f -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Run tests
        run: vendor/bin/pest

  phpunit-compatibility:
    name: "PHPUnit ${{ matrix.phpunit }} without Pest (PHP ${{ matrix.php }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.4', phpunit: '10.5.*' }
          - { php: '8.4', phpunit: '11.5.*' }
          - { php: '8.4', phpunit: '12.5.*' }
          - { php: '8.4', phpunit: '13.4.*' }

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: pcov

      - name: Install PHPUnit ${{ matrix.phpunit }} and paratest without Pest
        run: |
          composer remove --dev --no-update --no-interaction \
            ergebnis/composer-normalize laravel/pint pekral/ai-olympus pekral/phpcs-rules pekral/phpstan-rules pekral/rector-rules \
            pestphp/pest phpstan/phpstan-deprecation-rules phpstan/phpstan-phpunit
          composer require --dev --no-update --no-interaction "phpunit/phpunit:${{ matrix.phpunit }}" "brianium/paratest:*"
          composer update --prefer-dist --no-progress --no-interaction
          composer show phpunit/php-code-coverage | grep -E '^versions'

      - name: Analyse the PHPUnit fixture
        working-directory: tests/Fixtures/phpunit
        run: |
          php ../../../bin/test-redundancy tests > report.json
          php -r '$candidates = json_decode(file_get_contents("report.json"), true, flags: JSON_THROW_ON_ERROR)["summary"]["candidates"]; echo "candidates: $candidates\n"; exit($candidates === 2 ? 0 : 1);'
